// ─── CSS ─────────────────────────────────────────────────────────────────────
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600;700;800&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff; --card:#fff; --ink:#1c1510; --muted:#7a6f65;
  --border:#e2dbd0; --accent:#1c1510; --accent-light:#fdf3c7;
  --brand-yellow:#f8d21b;
  --nav-blue:#0ea5e9; --nav-blue-light:#e0f4fc;
  --time:#1a4a6e; --time-light:#e3edf5;
  --mat:#5a3d7a; --mat-light:#f0eaf7;
  --amber:#b5670a; --amber-light:#fdf0de;
  --red:#c0392b; --red-light:#fdecea;
  --green:#2d7a3d; --green-light:#e8f5eb;
  --yellow:#8a6800; --yellow-light:#fef9e0;
  --serif:'Epilogue',system-ui,sans-serif;
  --sans:'Epilogue',system-ui,sans-serif;
  --r:12px;
  --shadow:0 2px 14px rgba(28,21,16,.08);
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;}
.app{min-height:100vh;padding-bottom:84px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;grid-template-areas:"header header" "tabs main";}

.header{grid-area:header;background:var(--brand-yellow);color:var(--ink);padding:28px 20px 24px;text-align:center;position:relative;overflow:hidden;}
.header::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-55deg,transparent,transparent 60px,rgba(28,21,16,.04) 60px,rgba(28,21,16,.04) 61px);}
.header-inner{position:relative;}
.header-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.25em;color:var(--ink);border:1px solid rgba(28,21,16,.35);border-radius:4px;padding:4px 10px;margin-bottom:10px;}
.header h1{font-family:var(--sans);font-weight:800;font-size:clamp(2rem,7vw,2.8rem);line-height:1.1;margin-bottom:5px;}
.header h1 em{font-style:normal;font-weight:400;color:var(--ink);}
.header p{font-size:13px;opacity:.6;font-weight:500;color:var(--ink);}

.tabs{grid-area:tabs;display:flex;flex-direction:column;align-items:center;background:#fff;border-right:1px solid var(--border);gap:8px;padding:10px 6px;position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;z-index:10;}
.tab{width:52px;height:52px;flex-shrink:0;border:none;border-radius:16px;background:var(--nav-blue-light);font-size:0;font-family:var(--sans);font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;position:relative;}
.tab span{font-size:26px;line-height:1;}
.tab.active{background:var(--nav-blue);color:#fff;}
.tab-badge{position:absolute;top:6px;right:8px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:10px;padding:1px 5px;font-style:normal;min-width:16px;text-align:center;}

.main{grid-area:main;padding:18px 14px;min-width:0;}
.section-intro{margin-bottom:16px;}
.section-intro-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;}
.section-intro-row h2{font-family:var(--serif);font-size:1.4rem;margin-bottom:4px;}
.section-intro-row p{font-size:13px;color:var(--muted);}
.reset-btn{flex-shrink:0;padding:7px 14px;border:1.5px solid var(--border);border-radius:8px;background:none;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;margin-top:4px;white-space:nowrap;}
.reset-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-light);}

.cards-list{display:flex;flex-direction:column;gap:12px;}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);}
.item-card-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#faf9f6;border-bottom:1px solid var(--border);}
.name-input{border:none;background:none;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink);outline:none;flex:1;}
.del-btn{background:none;border:none;cursor:pointer;color:#ccc;font-size:14px;padding:2px 6px;border-radius:4px;transition:color .15s;}
.del-btn:hover{color:var(--red);}

.fields-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;}
.fields-grid.mt0{padding-top:4px;}
.nf{display:flex;flex-direction:column;gap:5px;}
.nf span,.field-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.field-label{margin-bottom:5px;}
.nf-inner{position:relative;display:flex;align-items:center;}
.nf-inner input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px 32px 8px 10px;font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink);background:#fafaf8;outline:none;transition:border-color .15s;}
.nf-inner input:focus{border-color:var(--accent);}
.nf-inner em{position:absolute;right:8px;font-style:normal;font-size:10px;color:var(--muted);}
.toggle-nf{flex-direction:row;align-items:center;justify-content:space-between;}
.full{grid-column:1/-1;}

.coat-row{display:flex;gap:6px;}
.coat-btn{width:38px;height:34px;border:1.5px solid var(--border);border-radius:7px;background:#fafaf8;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;}
.coat-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}

.toggle{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;}
.toggle input{display:none;}
.ttrack{position:absolute;inset:0;background:var(--border);border-radius:12px;cursor:pointer;transition:background .2s;}
.toggle input:checked+.ttrack{background:var(--accent);}
.ttrack::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle input:checked+.ttrack::after{transform:translateX(20px);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:500;}

.k-group{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;}
.k-group-head{display:flex;align-items:center;gap:8px;padding:11px 16px;background:#faf9f6;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;}
.k-icon{font-size:17px;line-height:1;}
.k-note{font-size:12px;color:var(--muted);padding:0 14px 12px;margin-top:-4px;}
.k-sub-note{font-size:12px;color:var(--muted);margin-top:-4px;margin-bottom:10px;}

/* PER-DOOR PREVIEW */
.per-door-preview{margin:0 14px 14px;border:1.5px solid var(--accent);border-radius:10px;overflow:hidden;}
.pdp-head{padding:9px 12px;background:var(--accent-light);font-size:12px;font-weight:700;color:var(--accent);}
.pdp-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted);}
.pdp-row strong{color:var(--ink);font-size:14px;}
.pdp-row.pdp-total{background:#faf9f6;}
.pdp-row.pdp-total strong{color:var(--accent);font-size:15px;font-family:var(--serif);}
.pdp-note{font-size:11px;color:var(--muted);padding:7px 12px;background:#fafaf8;text-align:center;}

/* RATE LENS — the learn-the-mapping panel */
.rate-lens{margin:0 14px 14px;border:1.5px solid var(--amber);border-radius:12px;overflow:hidden;background:#fff;}
.rl-head{padding:9px 14px;background:var(--amber);color:#fff;font-size:12px;font-weight:700;}
.rl-main{text-align:center;padding:16px 14px 10px;}
.rl-big{display:flex;align-items:baseline;justify-content:center;gap:2px;}
.rl-num{font-family:var(--serif);font-size:2.4rem;line-height:1;color:var(--ink);}
.rl-unit{font-size:1rem;font-weight:600;color:var(--ink);opacity:.7;}
.rl-sub{font-size:11px;color:var(--muted);margin-top:5px;}
.rl-compare{padding:4px 14px 10px;}
.rl-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;color:var(--muted);border-bottom:1px solid var(--border);}
.rl-row:last-child{border-bottom:none;}
.rl-row strong{color:var(--ink);font-size:14px;}
.rl-verdict{margin:0 14px 10px;padding:9px 12px;border-radius:8px;font-size:12.5px;font-weight:600;text-align:center;line-height:1.4;}
.rl-verdict.good{background:var(--green-light);color:var(--green);}
.rl-verdict.warn{background:var(--amber-light);color:var(--amber);}
.rl-note{font-size:11px;color:var(--muted);padding:0 14px 12px;line-height:1.5;}

/* BY-TIME CALCULATOR */
.by-time-calc{margin:0 14px 14px;border:1.5px dashed var(--accent);border-radius:10px;overflow:hidden;}
.btc-head{padding:9px 14px;background:var(--accent-light);font-size:12px;font-weight:700;color:var(--accent);}
.btc-result{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;color:var(--muted);}
.btc-result strong{font-family:var(--serif);font-size:1.4rem;color:var(--accent);}
.btc-apply{display:block;width:calc(100% - 28px);margin:0 14px 6px;padding:11px;border:none;border-radius:8px;background:var(--brand-yellow);color:var(--ink);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;}
.btc-apply:hover{opacity:.9;}
.pad{padding:14px;}

.side-toggle{display:flex;background:var(--bg);border-radius:8px;padding:3px;border:1px solid var(--border);}
.side-toggle button{flex:1;padding:7px 8px;border:none;border-radius:6px;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;background:none;color:var(--muted);transition:all .15s;}
.side-toggle button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12);}
.side-toggle.three button{padding:7px 4px;font-size:11px;}
.side-toggle.two-wide{margin-top:4px;}

.qty-btn{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;background:#fafaf8;}
.qty-btn button{width:34px;height:34px;border:none;background:none;font-size:18px;cursor:pointer;color:var(--muted);transition:background .1s;font-weight:300;}
.qty-btn button:hover{background:var(--border);}
.qty-btn span{min-width:32px;text-align:center;font-size:15px;font-weight:600;color:var(--ink);}

.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px;}
.opt-grid.three{grid-template-columns:1fr 1fr 1fr;}
.opt-btn{padding:11px 10px;border:1.5px solid var(--border);border-radius:10px;background:#fafaf8;font-family:var(--sans);text-align:left;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:3px;}
.opt-btn strong{font-size:13px;font-weight:600;color:var(--ink);}
.opt-btn span{font-size:11px;color:var(--muted);}
.opt-btn.active{background:var(--accent-light);border-color:var(--accent);}
.opt-btn.active strong{color:var(--accent);}

.slider-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
.slider-row input[type=range]{flex:1;accent-color:var(--accent);}
.slider-row strong{color:var(--accent);width:36px;text-align:right;}
.rate-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px 14px;font-size:12px;color:var(--muted);}
.chip{background:var(--accent-light);color:var(--accent);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;}

/* PREP CARDS */
.prep-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);}
.prep-card.prep-minor{border-left:4px solid #2d7a3d;}
.prep-card.prep-medium{border-left:4px solid #8a6800;}
.prep-card.prep-major{border-left:4px solid var(--red);}
.prep-card-head{display:flex;align-items:center;gap:12px;padding:14px 14px 10px;}
.prep-icon{font-size:22px;flex-shrink:0;}
.prep-title{font-size:15px;font-weight:700;color:var(--ink);}
.prep-desc{font-size:12px;color:var(--muted);margin-top:2px;}
.prep-card-head .qty-btn{margin-left:auto;flex-shrink:0;}
.prep-examples{font-size:12px;color:var(--muted);padding:0 14px 10px;line-height:1.5;font-style:italic;}
.prep-meta{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px;font-size:12px;color:var(--muted);}
.prep-total-time{font-weight:700;color:var(--accent);}

.prep-summary{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-top:4px;overflow:hidden;}
.prep-summary-head{padding:11px 16px;background:#faf9f6;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;}
.prep-sum-grid{display:grid;grid-template-columns:repeat(3,1fr);padding:14px;gap:10px;}
.psm{display:flex;flex-direction:column;gap:3px;text-align:center;}
.psm-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.psm-val{font-family:var(--serif);font-size:1.3rem;color:var(--ink);}

.major-warning{display:flex;gap:12px;background:var(--red-light);border:1px solid #f5c6c1;border-radius:var(--r);padding:14px;margin-top:12px;}
.major-warning.mb{margin-bottom:12px;}
.mw-icon{font-size:22px;flex-shrink:0;line-height:1.2;}
.major-warning strong{font-size:14px;display:block;margin-bottom:4px;color:var(--red);}
.major-warning p{font-size:12px;color:#7a3030;line-height:1.6;}

.prep-empty{background:var(--card);border:1.5px dashed var(--border);border-radius:var(--r);padding:24px;text-align:center;}
.prep-empty span{font-size:15px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px;}
.prep-empty p{font-size:13px;color:var(--muted);line-height:1.6;}

/* RESULTS */
.hero-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.hero-card{border-radius:var(--r);padding:16px 12px;text-align:center;box-shadow:var(--shadow);}
.hero-card.cost{background:var(--brand-yellow);color:var(--ink);}
.hero-card.materials{background:#fff;border:1.5px solid var(--border);color:var(--amber);}
.hero-card.time{background:#fff;border:1.5px solid var(--border);color:var(--ink);}
.hc-label{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.6;margin-bottom:5px;}
.hc-value{font-family:var(--serif);font-size:clamp(1.1rem,3.5vw,1.8rem);line-height:1.1;}
.hc-sub{display:flex;flex-direction:column;gap:1px;margin-top:5px;font-size:10px;opacity:.55;}
.warn-sub{opacity:1 !important;color:#f5c842;font-weight:600;}

.breakdown-list{padding:2px 0;}
.brow{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:1px solid var(--border);}
.brow:last-child{border-bottom:none;}
.brow-label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex:1;flex-wrap:wrap;}
.brow-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brow-time{font-size:12px;color:var(--amber);font-weight:600;min-width:56px;text-align:right;}
.brow-val{font-size:13px;font-weight:600;color:var(--ink);min-width:56px;text-align:right;}
.brow-time.hi{color:var(--brand-yellow);font-size:13px;}
.brow-val.hi{color:#fff;font-size:14px;}
.spray-tag{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--amber-light);color:var(--amber);border-radius:4px;padding:2px 5px;font-style:normal;}
.prep-tag{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--yellow-light);color:var(--yellow);border-radius:4px;padding:2px 5px;}
.sub-head{background:#faf9f6;}
.sub-head span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.sub-head .brow-time{font-size:11px;color:var(--muted);}
.total-brow{background:var(--ink);}
.elapsed-brow{background:var(--ink);}
.elapsed-brow .brow-label{color:#fff !important;}
.total-brow .brow-label{color:#fff;font-size:13px;font-weight:700;}
.total-brow .brow-val{color:var(--bg);font-size:14px;}
.total-brow .brow-time{color:var(--brand-yellow);}
.dry-row{background:#fef8f0;}
.dry-row .brow-label{color:var(--amber);}
.dry-row .brow-time,.dry-row .brow-val{color:var(--amber);}
.prep-brow{background:var(--yellow-light);}
.prep-brow .brow-label{color:var(--yellow);}
.prep-brow .brow-time{color:var(--yellow);}
.defect-chips{display:flex;gap:4px;flex-wrap:wrap;}
.dc{font-size:9px;font-weight:700;border-radius:4px;padding:2px 6px;font-style:normal;}
.dc.minor{background:var(--green-light);color:var(--green);}
.dc.medium{background:var(--yellow-light);color:var(--yellow);}
.dc.major{background:var(--red-light);color:var(--red);}

.water-toggle span{color:#1a5a7a !important;}

/* JOINERY & TRIM block in room card */
.trim-block{border-top:1px solid var(--border);background:#faf8f4;}
.trim-head{display:flex;align-items:center;gap:8px;padding:10px 14px 0;font-size:13px;font-weight:700;color:var(--ink);}
.trim-sub{font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
.trim-tag{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#efe7d8;color:#8a6d3b;border-radius:4px;padding:2px 5px;font-style:normal;}
.trim-foot{font-size:11px;color:var(--muted);padding:0 14px 12px;line-height:1.5;}
.trim-extras{border-top:1px dashed var(--border);margin:0 14px;padding:10px 0 4px;}
.trim-extras-head{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.trim-extras .misc-item-row{margin:0 0 6px;}
.trim-extras .add-btn.small{margin-top:4px;}

/* JOINERY PER-ITEM PRICING rows in settings */
.tr-row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);}
.tr-row:last-child{border-bottom:none;}
.tr-name{flex:1;font-size:13px;font-weight:600;color:var(--ink);display:flex;flex-direction:column;gap:1px;}
.tr-name em{font-size:10px;font-weight:500;font-style:normal;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);}
.tr-pair{display:flex;gap:8px;}
.tr-pair .nf{width:84px;}

/* JOB TYPE SELECTOR */
.job-type-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.job-btn{display:flex;align-items:center;gap:10px;padding:14px 12px;border:2px solid var(--border);border-radius:var(--r);background:var(--card);font-family:var(--sans);text-align:left;cursor:pointer;transition:all .2s;}
.job-btn:hover{border-color:var(--muted);}
.job-btn.active{border-color:var(--accent);background:var(--accent-light);}
.job-icon{font-size:24px;flex-shrink:0;line-height:1;}
.job-text{flex:1;}
.job-text strong{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px;}
.job-btn.active .job-text strong{color:var(--accent);}
.job-text span{font-size:11px;color:var(--muted);}
.job-coats{font-family:var(--serif);font-size:1.5rem;color:var(--border);font-weight:700;flex-shrink:0;line-height:1;}
.job-btn.active .job-coats{color:var(--accent);}

/* PROCESS CARD */
.process-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);}
.process-head{padding:10px 16px;background:#faf9f6;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;color:var(--ink);}
.process-list{list-style:none;padding:12px 16px;display:flex;flex-direction:column;gap:7px;}
.process-list li{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--ink);}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--brand-yellow);color:var(--ink);font-size:10px;font-weight:700;flex-shrink:0;line-height:1;}
.process-meta{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-top:1px solid var(--border);background:#faf9f6;}
.process-meta span{font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);border-radius:20px;padding:3px 10px;border:1px solid var(--border);}
.ttrack.water{}
.toggle input:checked + .ttrack.water{background:#1a6a9a;}
.water-damage-note{display:flex;align-items:flex-start;gap:10px;background:#e3f0f8;border:1px solid #b0d4ea;border-radius:8px;padding:10px 12px;margin:0 14px 10px;}
.wd-icon{font-size:20px;line-height:1.2;flex-shrink:0;}
.water-damage-note strong{font-size:13px;font-weight:700;color:#1a4a6e;display:block;margin-bottom:2px;}
.water-damage-note p{font-size:11px;color:#2a6080;line-height:1.5;}
.water-tag{font-size:9px;font-weight:700;letter-spacing:.06em;background:#e3f0f8;color:#1a5a7a;border-radius:4px;padding:2px 6px;font-style:normal;border:1px solid #b0d4ea;}
.water-brow{background:#f0f7fc;}
.water-brow .brow-label{color:#1a5a7a;}
.water-dry-row{background:#e8f4fb;}
.water-dry-row .brow-label{color:#1a5a7a;font-size:12px;}
.water-dry-row .brow-time{color:#1a5a7a;}
.water-dry-row .brow-val{color:#1a5a7a;font-size:12px;}
.markup-brow{background:#fdf8ee;}
.markup-brow .brow-label{color:#7a5a1a;font-style:italic;font-size:12px;}
.markup-brow .brow-val{color:#7a5a1a;}
.disclaimer{margin-top:8px;padding:13px;background:var(--accent-light);border-radius:10px;font-size:12px;color:var(--ink);line-height:1.7;}

.add-btn{width:100%;margin-top:12px;padding:13px;border:1.5px dashed var(--border);border-radius:var(--r);background:none;font-family:var(--sans);font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;}
.add-btn:hover{border-color:var(--accent);color:var(--accent);}
.add-btn.small{padding:9px;font-size:13px;margin-top:8px;}

/* Staircase rows */
.misc-stair-row{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--border);}
.misc-stair-row:last-of-type{border-bottom:none;}
.msr-label{font-size:13px;font-weight:500;color:var(--ink);flex:0 0 160px;min-width:120px;}
.msr-fields{display:flex;flex-wrap:wrap;gap:8px;flex:1;}
.msr-fields .nf{flex:1;min-width:80px;}
.stair-summary{margin:10px 14px 4px;padding:8px 12px;background:var(--accent-light);border-radius:8px;font-size:13px;color:var(--ink);font-weight:600;display:flex;gap:12px;}

/* Misc items */
.misc-item-row{border:1px solid var(--border);border-radius:10px;margin:6px 14px;overflow:hidden;}
.mir-top{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--border);}
.mir-name{flex:1;border:none;background:none;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink);outline:none;padding:2px 4px;}
.mir-name::placeholder{color:var(--muted);}
.mir-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);}
.mir-row .side-toggle{flex-shrink:0;}
.mir-row .nf{flex:1;min-width:90px;}

.sticky-bar{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:0;cursor:pointer;z-index:100;border-top:1px solid #2a2018;}
.sb-block{display:flex;flex-direction:column;gap:1px;flex:1;}
.sb-label{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.4;}
.sb-total{font-family:var(--serif);font-size:1.3rem;color:var(--brand-yellow);line-height:1.1;}
.sb-mat{font-family:var(--serif);font-size:1.3rem;color:var(--bg);line-height:1.1;}
.sb-time{font-family:var(--serif);font-size:1.3rem;color:var(--bg);line-height:1.1;}
.sb-divider{width:1px;height:32px;background:rgba(255,255,255,.15);margin:0 12px;}
.sb-tap{font-size:16px;opacity:.25;margin-left:6px;}

@media(max-width:480px){
  .fields-grid{grid-template-columns:1fr 1fr;}
  .opt-grid{grid-template-columns:1fr 1fr;}
  .hero-trio{grid-template-columns:repeat(3,1fr);}
  .hc-value{font-size:1rem;}
}

/* QUOTE ACTIONS + LIST (screen) */
.results-actions{display:flex;gap:10px;margin-top:12px;}
.action-btn{flex:1;padding:13px;border-radius:var(--r);font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);transition:all .15s;}
.action-btn.solid{background:var(--ink);color:#fff;border-color:var(--ink);}
.action-btn.ghost{background:none;color:var(--ink);}
.action-btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
.quote-summary-bar{display:flex;gap:8px;padding:0 14px 12px;}
.quote-summary-bar div{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:2px;}
.quote-summary-bar span{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.quote-summary-bar strong{font-family:var(--serif);font-size:1.05rem;color:var(--ink);}
.save-msg{margin:0 14px 14px;padding:8px;background:var(--accent-light);color:var(--accent);border-radius:8px;font-size:13px;font-weight:600;text-align:center;}
.quote-list{display:flex;flex-direction:column;}
.quote-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);}
.quote-row:last-child{border-bottom:none;}
.quote-row.loaded{background:var(--accent-light);}
.qr-main{flex:1;min-width:0;}
.qr-name{font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;}
.qr-open{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--brand-yellow);color:var(--ink);border-radius:4px;padding:1px 5px;font-style:normal;}
.qr-meta{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qr-actions{display:flex;gap:6px;flex-shrink:0;}
.qr-actions button{border:1.5px solid var(--border);background:#fafaf8;border-radius:7px;padding:7px 12px;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;}
.qr-actions .qr-del{color:var(--red);border-color:#f0d0cc;padding:7px 10px;}
.nf-inner input[type=text]{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 10px;font-family:var(--sans);font-size:14px;color:var(--ink);background:#fafaf8;outline:none;}
.nf-inner input[type=text]:focus{border-color:var(--accent);}
.nf-area{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 10px;font-family:var(--sans);font-size:14px;color:var(--ink);background:#fafaf8;outline:none;resize:vertical;line-height:1.5;}
.nf-area:focus{border-color:var(--accent);}
.bank-head{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 14px 8px;}

/* LOGO UPLOAD */
.logo-row{display:flex;align-items:center;gap:12px;padding:14px;}
.logo-preview{width:96px;height:54px;border:1px solid var(--border);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.logo-preview img{max-width:100%;max-height:100%;object-fit:contain;}
.logo-empty{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
.logo-actions{display:flex;flex-wrap:wrap;gap:6px;}
.logo-upload-btn{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.logo-clear{background:none;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;}
.logo-clear:hover{border-color:var(--accent);color:var(--accent);}

/* Unit toggle */
.unit-toggle-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.unit-toggle-row span{font-size:12px;color:rgba(28,21,16,0.6);font-weight:600;letter-spacing:.05em;text-transform:uppercase;}
.header .side-toggle{background:rgba(28,21,16,.08);border-color:rgba(28,21,16,.18);}
.header .side-toggle button{color:rgba(28,21,16,.55);}
.unit-tog{background:rgba(255,255,255,0.12) !important;}
.unit-tog button{font-size:11px !important;padding:3px 10px !important;min-width:36px;color:rgba(255,255,255,0.7) !important;border-color:rgba(255,255,255,0.2) !important;}
.unit-tog button.active{background:rgba(255,255,255,0.28) !important;color:#fff !important;}

/* PRINT QUOTE — hidden on screen */
.print-quote{display:none;}

@media print {
  .app{display:none !important;}
  .print-quote{display:block !important;color:#111;font-family:Georgia,'Times New Roman',serif;}
  @page{margin:16mm;}
  .pq-page{break-after:page;page-break-after:always;}
  .pq-page:last-child{break-after:auto;page-break-after:auto;}

  /* Cover */
  .pq-cover{text-align:center;padding-top:10mm;}
